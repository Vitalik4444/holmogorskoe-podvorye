# Временный конфиг podvorye.com — только чтобы certbot смог подтвердить домен.
# Сразу после выпуска сертификата заменяется на боевой podvorye.com.nginx.conf
# (там https и переадресация www). Порядок — в DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name podvorye.com www.podvorye.com;

    root /var/www/podvorye.com;
    index index.html;

    charset utf-8;

    # ---- сжатие ----
    # Видео и картинки не жмём: они уже сжаты, повторное сжатие только греет процессор.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    gzip_vary on;

    # ---- кеш ----
    # Стили и скрипт подписаны хешем в имени запроса (?v=...), поэтому их можно
    # кешировать надолго: при изменении файла меняется адрес.
    location ~* \.(?:css|js)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Шрифты и картинки меняются редко.
    location ~* \.(?:woff2|ttf|otf|png|jpe?g|svg|webp|ico)$ {
        expires 180d;
        add_header Cache-Control "public, max-age=15552000, immutable";
        access_log off;
    }

    # ---- видео ----
    # Первый экран перематывается прокруткой, а перемотка невозможна без
    # Range-запросов. Nginx поддерживает их сам, здесь только явно объявляем
    # и отключаем буферизацию, чтобы перемотка отвечала сразу.
    location ~* \.(?:mp4|webm)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=15552000";
        mp4;
        access_log off;
    }

    # ---- html ----
    # Разметку не кешируем: правки должны доезжать сразу.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- безопасность ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- маршрутизация ----
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;

    # Служебное наружу не отдаём: сайт лежит в клоне репозитория,
    # рядом с ним папка deploy и README.
    location ~ /\. {
        deny all;
    }
    location ^~ /deploy {
        deny all;
    }
    location = /README.md {
        deny all;
    }
}
